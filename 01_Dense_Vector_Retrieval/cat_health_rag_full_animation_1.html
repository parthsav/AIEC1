<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Health RAG — Full Animation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Courier New',monospace;font-size:12px;min-height:100vh;display:flex;flex-direction:column}
#topbar{background:#161b22;border-bottom:1px solid #21262d;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0}
#topbar .title{color:#f0883e;font-weight:bold;font-size:13px;white-space:nowrap}
#task-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:12px;cursor:pointer;font-size:10px;border:1px solid #30363d;background:transparent;color:#8b949e;font-family:'Courier New',monospace;transition:all .2s}
.pill.active{background:#0e4429;color:#3fb950;border-color:#3fb950}
.pill.done{background:#1a3a5c;color:#58a6ff;border-color:#58a6ff}
#controls{background:#161b22;border-bottom:1px solid #21262d;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
button{font-family:'Courier New',monospace;font-size:11px;padding:6px 12px;border-radius:5px;cursor:pointer;transition:all .15s;border:none}
.btn-green{background:#0e4429;color:#3fb950;border:1px solid #3fb950}
.btn-green:hover{background:#1a5c35}
.btn-blue{background:#0c2d6b;color:#58a6ff;border:1px solid #58a6ff}
.btn-blue:hover{background:#1a4a8a}
.btn-grey{background:transparent;color:#8b949e;border:1px solid #30363d}
.btn-grey:hover{background:#21262d}
.btn-orange{background:#3d2200;color:#f0883e;border:1px solid #f0883e}
.btn-orange:hover{background:#5a3200}
#speed-wrap{display:flex;align-items:center;gap:6px;color:#8b949e;font-size:10px}
#speed{width:80px;accent-color:#f0883e}
#progress-bar{flex:1;height:6px;background:#21262d;border-radius:3px;overflow:hidden;min-width:80px}
#progress-fill{height:100%;background:linear-gradient(90deg,#3fb950,#58a6ff);border-radius:3px;transition:width .3s}
#step-counter{color:#8b949e;font-size:10px;white-space:nowrap}
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#sidebar{width:240px;flex-shrink:0;background:#161b22;border-right:1px solid #21262d;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.sidebar-section{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:8px}
.sidebar-title{color:#8b949e;font-size:10px;letter-spacing:.05em;margin-bottom:6px;text-transform:uppercase}
.task-item{padding:5px 8px;border-radius:4px;cursor:pointer;border:1px solid transparent;color:#8b949e;font-size:10px;margin-bottom:3px;transition:all .2s}
.task-item.active{color:#f0883e;border-color:#f0883e;background:rgba(240,136,62,.07)}
.task-item.done{color:#3fb950;border-color:#3fb950;background:rgba(63,185,80,.05)}
.field-card{background:#1c2330;border-radius:4px;margin-bottom:4px;overflow:hidden;border:1px solid #21262d;transition:border-color .3s,box-shadow .3s}
.field-card.dirty{border-color:#f0883e;box-shadow:0 0 6px rgba(240,136,62,.4)}
.field-card.set{border-color:#58a6ff;box-shadow:0 0 4px rgba(88,166,255,.2)}
.field-card.warn{border-color:#ff7b72;box-shadow:0 0 6px rgba(255,123,114,.3)}
.field-top{display:flex;justify-content:space-between;padding:3px 6px;font-size:9px;color:#8b949e}
.field-badge{font-size:8px;padding:1px 4px;border-radius:3px;background:#21262d;color:#8b949e}
.field-val{padding:2px 6px 4px;font-size:10px;color:#79c0ff;word-break:break-all}
.field-val.empty{color:#30363d;font-style:italic}
#canvas-wrap{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-width:0}
#canvas{border-radius:8px;background:#0a0e14;display:block;max-width:100%}
#desc-panel{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:10px 14px;font-size:11px;line-height:1.8;color:#e6edf3;min-height:64px;flex-shrink:0}
#desc-panel strong{color:#3fb950}
#desc-panel code{font-family:'Courier New',monospace;font-size:10px;color:#79c0ff;background:rgba(88,166,255,.08);padding:1px 4px;border-radius:3px}
#desc-panel em{color:#f0883e}
#log-panel{background:#0d1117;border:1px solid #21262d;border-radius:6px;height:90px;overflow-y:auto;flex-shrink:0}
#log-body{padding:4px 8px}
.log-line{font-size:10px;padding:1px 0;display:flex;gap:6px}
.log-line .ts{color:#30363d;flex-shrink:0}
.log-line.info .msg{color:#e6edf3}
.log-line.data .msg{color:#f0883e}
.log-line.node .msg{color:#3fb950}
.log-line.edge .msg{color:#bc8cff}
.log-line.tool .msg{color:#58a6ff}
.log-line.warn .msg{color:#ff7b72}
.log-line.metric .msg{color:#bc8cff}
.log-line.ok .msg{color:#3fb950}
#obj-label{font-size:10px;color:#f0883e;margin-bottom:4px;font-weight:bold}
</style>
</head>
<body>

<div id="topbar">
  <span class="title">🐱 Cat Health RAG — Interactive Walkthrough</span>
  <div id="task-pills">
    <button class="pill" onclick="jumpTask(0)">Goal</button>
    <button class="pill" onclick="jumpTask(1)">T1: Setup</button>
    <button class="pill" onclick="jumpTask(2)">T2: Embeddings</button>
    <button class="pill" onclick="jumpTask(3)">T3: Load PDF</button>
    <button class="pill" onclick="jumpTask(4)">T4: Chunking</button>
    <button class="pill" onclick="jumpTask(5)">T5: Qdrant</button>
    <button class="pill" onclick="jumpTask(6)">T6: Retrieval</button>
    <button class="pill" onclick="jumpTask(7)">T7: RAG</button>
    <button class="pill" onclick="jumpTask(8)">Activity</button>
  </div>
</div>

<div id="controls">
  <button class="btn-green" onclick="doStep()">STEP →</button>
  <button class="btn-orange" id="play-btn" onclick="togglePlay()">▶ PLAY</button>
  <button class="btn-grey" onclick="doReset()">↺ RESET</button>
  <button class="btn-grey" onclick="doPrev()">◀ PREV</button>
  <button class="btn-blue" onclick="doNext()">NEXT ▶</button>
  <div id="speed-wrap">
    Speed <input type="range" id="speed" min="1" max="5" value="2"> Fast
  </div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <span id="step-counter">0 / 0</span>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Tasks</div>
      <div class="task-item" onclick="jumpTask(0)">🎯 Notebook Goal</div>
      <div class="task-item" onclick="jumpTask(1)">T1: Environment Setup</div>
      <div class="task-item" onclick="jumpTask(2)">T2: Embedding Primer</div>
      <div class="task-item" onclick="jumpTask(3)">T3: Load PDF</div>
      <div class="task-item" onclick="jumpTask(4)">T4: Chunking</div>
      <div class="task-item" onclick="jumpTask(5)">T5: Embed + Qdrant</div>
      <div class="task-item" onclick="jumpTask(6)">T6: Retrieval Scores</div>
      <div class="task-item" onclick="jumpTask(7)">T7: RAG Generation</div>
      <div class="task-item" onclick="jumpTask(8)">🔬 Activity: Tune</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Object Inspector</div>
      <div id="obj-label">—</div>
      <div id="inspector"></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="desc-panel">Press <strong>STEP →</strong> or <strong>▶ PLAY</strong> to begin.</div>
    <div id="log-panel"><div id="log-body"></div></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvas-wrap');
let CW = 800, CH = 340;
const SIM = {};

function setupCanvas() {
  const d = window.devicePixelRatio || 1;
  const rect = canvasWrap.getBoundingClientRect();
  const w = Math.max(400, rect.width - 20);
  CW = w;
  canvas.width = w * d;
  canvas.height = CH * d;
  canvas.style.width = w + 'px';
  canvas.style.height = CH + 'px';
  ctx.scale(d, d);
  if (currentStep >= 0) renderCurrent();
}
window.addEventListener('resize', setupCanvas);

// Drawing primitives
function clr() { ctx.clearRect(0, 0, CW, CH); }
function grid() {
  ctx.save();
  ctx.strokeStyle = '#0f1520'; ctx.lineWidth = 1;
  for (let x = 0; x < CW; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke(); }
  for (let y = 0; y < CH; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke(); }
  ctx.restore();
}
function rr(ctx2, x, y, w, h, r) {
  ctx2.beginPath();
  ctx2.moveTo(x+r,y); ctx2.lineTo(x+w-r,y);
  ctx2.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx2.lineTo(x+w,y+h-r); ctx2.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx2.lineTo(x+r,y+h); ctx2.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx2.lineTo(x,y+r); ctx2.quadraticCurveTo(x,y,x+r,y);
  ctx2.closePath();
}
function box(x, y, w, h, {fill='#1c2330', stroke='#30363d', r=6, glow=null, lw=1.5}={}) {
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 14; }
  rr(ctx, x, y, w, h, r);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = lw;
  ctx.stroke();
  ctx.restore();
}
function lbl(text, x, y, {color='#e6edf3', size=11, bold=false, align='center', max=0}={}) {
  ctx.save();
  ctx.font = (bold?'bold ':'')+size+'px "Courier New",monospace';
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (max && ctx.measureText(text).width > max) {
    while (text.length > 3 && ctx.measureText(text+'…').width > max) text = text.slice(0,-1);
    text += '…';
  }
  ctx.fillText(text, x, y);
  ctx.restore();
}
function arw(x1, y1, x2, y2, {color='#30363d', active=false, lw=1.5, dash=[]}={}) {
  ctx.save();
  if (active) { ctx.shadowColor = color; ctx.shadowBlur = 8; }
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const angle = Math.atan2(y2-y1, x2-x1);
  const hs = 7;
  ctx.fillStyle = color; ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs*Math.cos(angle-0.4), y2 - hs*Math.sin(angle-0.4));
  ctx.lineTo(x2 - hs*Math.cos(angle+0.4), y2 - hs*Math.sin(angle+0.4));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function pkt(x, y, text, color='#f0883e', r=14) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = color+'33'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  lbl(text, x, y, {color, size:9, bold:true});
}

// Execution log
let logTs = 0;
function addLog(type, msg) {
  const lb = document.getElementById('log-body');
  const d = document.createElement('div');
  d.className = `log-line ${type}`;
  logTs++;
  d.innerHTML = `<span class="ts">[${String(logTs).padStart(3,'0')}]</span><span class="msg">${msg}</span>`;
  lb.appendChild(d);
  lb.scrollTop = lb.scrollHeight;
}

// Object inspector
function setInspector(label, fields) {
  document.getElementById('obj-label').textContent = label || '—';
  const el = document.getElementById('inspector');
  el.innerHTML = '';
  if (!fields) return;
  fields.forEach(({k, v, s=''}) => {
    const card = document.createElement('div');
    card.className = `field-card ${s}`;
    card.innerHTML = `<div class="field-top"><span>${k}</span><span class="field-badge">${s||'empty'}</span></div><div class="field-val${!v?' empty':''}">${v||'—'}</div>`;
    el.appendChild(card);
    if (s==='dirty') { setTimeout(()=>{card.classList.remove('dirty');card.classList.add('set');card.querySelector('.field-badge').textContent='set';},500); }
  });
}

// Step system
let allTasks = [];
let currentTask = -1;
let currentStep = -1;
let playTimer = null;
let isPlaying = false;

function buildAllTasks() {
  allTasks = [
    buildTask0(),
    buildTask1(),
    buildTask2(),
    buildTask3(),
    buildTask4(),
    buildTask5(),
    buildTask6(),
    buildTask7(),
    buildTask8()
  ];
}

function totalSteps() {
  return allTasks.reduce((s,t) => s+t.steps.length, 0);
}
function globalStepIdx() {
  let g = 0;
  for (let i = 0; i < currentTask; i++) g += allTasks[i].steps.length;
  return g + currentStep;
}

function jumpTask(ti) {
  if (currentTask >= 0 && currentTask < allTasks.length) {
    const ct = allTasks[currentTask];
    if (currentStep >= 0 && currentStep < ct.steps.length && ct.steps[currentStep].onLeave) ct.steps[currentStep].onLeave();
  }
  if (SIM._timer) { clearInterval(SIM._timer); SIM._timer = null; }
  currentTask = ti;
  currentStep = -1;
  updateTaskUI();
  clearInspector();
  clr(); grid();
  document.getElementById('desc-panel').innerHTML = `<strong>${allTasks[ti].name}</strong> — press <strong>STEP →</strong> to begin.`;
}

function clearInspector() { setInspector('—', []); }

function doStep() {
  if (currentTask < 0) { jumpTask(0); return; }
  const task = allTasks[currentTask];
  if (currentStep >= 0 && currentStep < task.steps.length && task.steps[currentStep].onLeave) task.steps[currentStep].onLeave();
  currentStep++;
  if (currentStep >= task.steps.length) {
    // mark task done, go next
    if (currentTask < allTasks.length - 1) {
      jumpTask(currentTask + 1);
      doStep();
    } else {
      currentStep = task.steps.length - 1;
    }
    return;
  }
  execStep(task.steps[currentStep]);
  updateTaskUI();
  updateProgress();
}

function execStep(step) {
  clr(); grid();
  step.render();
  if (step.log) addLog(step.log.t, step.log.m);
  if (step.desc) document.getElementById('desc-panel').innerHTML = step.desc;
  if (step.obj) setInspector(step.obj.label, step.obj.fields);
  if (step.onEnter) step.onEnter();
}

function renderCurrent() {
  if (currentTask < 0 || currentStep < 0) return;
  const task = allTasks[currentTask];
  if (currentStep < task.steps.length) {
    clr(); grid();
    task.steps[currentStep].render();
  }
}

function doPrev() {
  if (currentTask < 0) return;
  if (currentStep > 0) {
    const task = allTasks[currentTask];
    if (task.steps[currentStep].onLeave) task.steps[currentStep].onLeave();
    currentStep--;
    execStep(task.steps[currentStep]);
  } else if (currentTask > 0) {
    jumpTask(currentTask - 1);
    currentStep = allTasks[currentTask].steps.length - 1;
    execStep(allTasks[currentTask].steps[currentStep]);
  }
  updateTaskUI(); updateProgress();
}
function doNext() { doStep(); }
function doReset() {
  stopPlay();
  if (SIM._timer) { clearInterval(SIM._timer); SIM._timer = null; }
  for (let k in SIM) delete SIM[k];
  logTs = 0;
  document.getElementById('log-body').innerHTML = '';
  currentTask = -1; currentStep = -1;
  clearInspector();
  clr(); grid();
  document.getElementById('desc-panel').innerHTML = 'Press <strong>STEP →</strong> or <strong>▶ PLAY</strong> to begin.';
  updateTaskUI(); updateProgress();
}
function togglePlay() {
  if (isPlaying) stopPlay();
  else startPlay();
}
function startPlay() {
  isPlaying = true;
  document.getElementById('play-btn').textContent = '⏸ PAUSE';
  document.getElementById('play-btn').className = 'btn-orange';
  const delay = () => Math.max(400, 2200 - parseInt(document.getElementById('speed').value) * 360);
  playTimer = setInterval(() => {
    const lastTask = currentTask === allTasks.length - 1;
    const lastStep = currentTask >= 0 && currentStep >= allTasks[currentTask].steps.length - 1;
    if (lastTask && lastStep) { stopPlay(); return; }
    doStep();
  }, delay());
}
function stopPlay() {
  isPlaying = false;
  clearInterval(playTimer);
  document.getElementById('play-btn').textContent = '▶ PLAY';
  document.getElementById('play-btn').className = 'btn-orange';
}
function updateTaskUI() {
  const pills = document.querySelectorAll('.pill');
  const items = document.querySelectorAll('.task-item');
  pills.forEach((p,i) => { p.className = 'pill' + (i===currentTask?' active':(i<currentTask?' done':'')); });
  items.forEach((it,i) => { it.className = 'task-item' + (i===currentTask?' active':(i<currentTask?' done':'')); });
}
function updateProgress() {
  const g = globalStepIdx() + 1;
  const t = totalSteps();
  document.getElementById('progress-fill').style.width = (t > 0 ? (g/t*100) : 0) + '%';
  document.getElementById('step-counter').textContent = g + ' / ' + t;
}

// ─────────────────── TASK 0: NOTEBOOK GOAL ───────────────────
function buildTask0() {
  return { name:'🎯 Notebook Goal', steps: [
    { // step 0: what is RAG
      render() {
        clr(); grid();
        const cx = CW/2, cy = CH/2;
        // Title
        lbl('What is RAG — and why does it matter?', cx, 28, {color:'#f0883e', size:14, bold:true});

        // Three boxes: Problem → RAG Pipeline → Benefit
        const bw = Math.min(160, CW*0.22), bh = 80, gap = Math.min(60, CW*0.1);
        const x0 = cx - bw - gap - bw/2, x1 = cx - bw/2, x2 = cx + bw/2 + gap;
        const by = cy - bh/2 + 10;

        // Problem box
        box(x0, by, bw, bh, {fill:'#2d1010', stroke:'#ff7b72', glow:'#ff7b72'});
        lbl('❌ Problem', x0+bw/2, by+16, {color:'#ff7b72', size:11, bold:true});
        lbl('GPT knows only', x0+bw/2, by+34, {color:'#8b949e', size:9});
        lbl('training data.', x0+bw/2, by+46, {color:'#8b949e', size:9});
        lbl('No cat PDF!', x0+bw/2, by+60, {color:'#ff7b72', size:9, bold:true});

        // Arrow
        arw(x0+bw, by+bh/2, x1-4, by+bh/2, {color:'#f0883e', active:true, lw:2});
        lbl('solution', (x0+bw+x1)/2, by+bh/2-12, {color:'#f0883e', size:9});

        // RAG box
        box(x1, by, bw, bh, {fill:'#0e3a1a', stroke:'#3fb950', glow:'#3fb950'});
        lbl('✅ RAG', x1+bw/2, by+16, {color:'#3fb950', size:11, bold:true});
        lbl('Retrieve chunks', x1+bw/2, by+34, {color:'#8b949e', size:9});
        lbl('from PDF →', x1+bw/2, by+46, {color:'#8b949e', size:9});
        lbl('give to model', x1+bw/2, by+60, {color:'#58a6ff', size:9});

        // Arrow
        arw(x1+bw, by+bh/2, x2-4, by+bh/2, {color:'#3fb950', active:true, lw:2});
        lbl('result', (x1+bw+x2)/2, by+bh/2-12, {color:'#3fb950', size:9});

        // Benefit box
        box(x2, by, bw, bh, {fill:'#0c2d6b', stroke:'#58a6ff', glow:'#58a6ff'});
        lbl('💡 Outcome', x2+bw/2, by+16, {color:'#58a6ff', size:11, bold:true});
        lbl('Grounded answers', x2+bw/2, by+34, {color:'#8b949e', size:9});
        lbl('from real docs.', x2+bw/2, by+46, {color:'#8b949e', size:9});
        lbl('Cites sources!', x2+bw/2, by+60, {color:'#3fb950', size:9});

        // Analogy
        lbl('Analogy: You\'re a student who got the exam questions ahead of time (PDF)', cx, by+bh+32, {color:'#bc8cff', size:10});
        lbl('You look up answers in the notes → hand them to AI → AI writes the answer.', cx, by+bh+48, {color:'#8b949e', size:9});
      },
      log: {t:'info', m:'Notebook goal: build a Cat Health PDF question-answering system using RAG'},
      desc: `<strong>What is RAG?</strong> Retrieval-Augmented Generation means we <em>retrieve</em> relevant text from a document, then <em>give it</em> to an AI to write an answer. Without RAG, the AI only knows what it was trained on — it has never seen your cat health PDF. With RAG, we look up the relevant pages for you, and the AI answers from those pages. <strong>Think of it like open-book exam</strong>: the AI is the student, your PDF is the textbook, and we mark the right pages before the exam starts.`,
      obj: { label:'Notebook', fields:[
        {k:'goal', v:'Cat Health Q&A system', s:'set'},
        {k:'data_source', v:'cat_health_guidelines.pdf', s:'set'},
        {k:'retrieval', v:'Dense vector search (Qdrant)', s:'set'},
        {k:'generation', v:'GPT-5.4-mini via OpenAI', s:'set'},
      ]}
    },
    { // step 1: pipeline overview
      render() {
        clr(); grid();
        lbl('The 6-Step Pipeline We\'ll Build Today', CW/2, 22, {color:'#f0883e', size:13, bold:true});

        const steps6 = [
          {icon:'📄', name:'Load PDF', color:'#58a6ff', fill:'#0c2d6b', stroke:'#58a6ff'},
          {icon:'✂️', name:'Chunk Text', color:'#bc8cff', fill:'#1a0e3a', stroke:'#bc8cff'},
          {icon:'🔢', name:'Embed Chunks', color:'#f0883e', fill:'#3d2200', stroke:'#f0883e'},
          {icon:'🗄️', name:'Store in Qdrant', color:'#3fb950', fill:'#0e3a1a', stroke:'#3fb950'},
          {icon:'🔍', name:'Retrieve Top-K', color:'#ffa657', fill:'#3d2700', stroke:'#ffa657'},
          {icon:'🤖', name:'Generate Answer', color:'#ff7b72', fill:'#2d1010', stroke:'#ff7b72'},
        ];
        const bw = Math.min(98, (CW - 40) / 6 - 8), bh = 72;
        const totalW = steps6.length * bw + (steps6.length-1) * 12;
        let sx = (CW - totalW) / 2;
        const by = 65;

        steps6.forEach((s, i) => {

// ─────────────────── TASK 2: EMBEDDING SIMILARITY ───────────────────
function buildTask2() {
  return { name:'T2: Embedding Primer', steps: [
    {
      render() {
        clr(); grid();
        lbl('T2: What is an Embedding? — Text → Numbers', CW/2, 22, {color:'#f0883e', size:13, bold:true});
        lbl('← T1 imported the tools. Now: what does OpenAIEmbeddings actually DO?', CW/2, 40, {color:'#8b949e', size:9});

        // 2D meaning space visualization
        const ox = CW * 0.30, oy = CH - 60;
        const axLen = Math.min(CW * 0.55, 340), ayLen = 200;

        // Axes
        arw(ox, oy, ox+axLen, oy, {color:'#30363d', lw:1.5});
        arw(ox, oy, ox, oy-ayLen, {color:'#30363d', lw:1.5});
        lbl('→ "animal" meaning', ox+axLen/2, oy+16, {color:'#30363d', size:9});
        lbl('↑ "royalty"', ox-36, oy-ayLen/2, {color:'#30363d', size:9});

        // Points in meaning space
        const pts = [
          {name:'king',  x:0.55, y:0.82, color:'#58a6ff'},
          {name:'queen', x:0.50, y:0.78, color:'#58a6ff'},
          {name:'cat',   x:0.85, y:0.18, color:'#3fb950'},
          {name:'vet',   x:0.78, y:0.22, color:'#3fb950'},
          {name:'banana',x:0.15, y:0.08, color:'#ff7b72'},
          {name:'cat health\nguidelines', x:0.80, y:0.28, color:'#ffa657'},
        ];

        pts.forEach(p => {
          const px = ox + p.x * axLen, py = oy - p.y * ayLen;
          ctx.save();
          ctx.shadowColor = p.color; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2);
          ctx.fillStyle = p.color+'55'; ctx.fill();
          ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.stroke();
          ctx.restore();
          const lines = p.name.split('\n');
          lines.forEach((line, i) => lbl(line, px+12, py - 6 + i*12, {color:p.color, size:9, align:'left'}));
        });

        // Similarity line king-queen
        const k = pts[0], q = pts[1];
        const kx = ox+k.x*axLen, ky = oy-k.y*ayLen;
        const qx = ox+q.x*axLen, qy = oy-q.y*ayLen;
        ctx.save(); ctx.strokeStyle='#58a6ff'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(kx,ky); ctx.lineTo(qx,qy); ctx.stroke(); ctx.restore();
        lbl('sim=0.93', (kx+qx)/2+20, (ky+qy)/2, {color:'#58a6ff', size:8, bold:true});

        // Score legend
        const lx = 20, ly = 60;
        box(lx, ly, 130, 100, {fill:'#1c2330', stroke:'#21262d', r:6});
        lbl('Similarity Scores', lx+65, ly+14, {color:'#8b949e', size:9});
        [['king ↔ queen','0.93','#3fb950'],['cat ↔ vet','0.73','#58a6ff'],['cat ↔ cat health','0.61','#ffa657'],['king ↔ banana','0.20','#ff7b72']].forEach(([pair,score,c],i) => {
          lbl(pair, lx+8, ly+30+i*18, {color:'#8b949e', size:8, align:'left'});
          lbl(score, lx+122, ly+30+i*18, {color:c, size:9, bold:true, align:'right'});
        });
      },
      log: {t:'tool', m:'OpenAIEmbeddings(model="text-embedding-3-small") — calling API to embed words'},
      desc: `<strong>What is an embedding?</strong> The model turns each word or sentence into a list of ~1500 numbers. Words with similar meanings end up with <em>similar numbers</em> — so "king" and "queen" land close together, while "banana" is far from both. This 2D map shows the idea visually (real embeddings have 1500 dimensions!). <strong>Cosine similarity</strong> measures how close two vectors are — score near 1.0 means very similar meaning, near 0.0 means unrelated. <em>This is the core of RAG retrieval.</em>`,
      obj: { label:'OpenAIEmbeddings', fields:[
        {k:'model', v:'text-embedding-3-small', s:'set'},
        {k:'output_dims', v:'~1536 floats per text', s:'set'},
        {k:'king ↔ queen', v:'0.93 (very close)', s:'set'},
        {k:'cat ↔ veterinarian', v:'0.73 (related)', s:'set'},
        {k:'king ↔ banana', v:'0.20 (unrelated)', s:'set'},
      ]}
    },
    {
      render() {
        clr(); grid();
        lbl('T2: Cosine Similarity — How We Measure "Closeness"', CW/2, 22, {color:'#f0883e', size:13, bold:true});

        // Formula visualization
        const fy = 70;
        box(CW/2-200, fy, 400, 52, {fill:'#1c2330', stroke:'#bc8cff', glow:'#bc8cff33', r:8});
        lbl('cosine_similarity(a, b)', CW/2, fy+14, {color:'#bc8cff', size:12, bold:true});
        lbl('= dot_product(a,b) / ( magnitude(a) × magnitude(b) )', CW/2, fy+34, {color:'#79c0ff', size:10});

        // Visual: two vectors as arrows
        const ox = CW/2 - 60, oy = 175;
        ctx.save();
        // Vector a
        ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox-50, oy-60); ctx.stroke();
        lbl('a', ox-52, oy-66, {color:'#3fb950', size:11, bold:true});
        // Vector b (close angle)
        ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox-10, oy-72); ctx.stroke();
        lbl('b', ox-6, oy-80, {color:'#58a6ff', size:11, bold:true});
        // Angle arc
        ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(ox, oy, 28, -Math.PI*0.8, -Math.PI*0.45); ctx.stroke();
        lbl('θ small', ox-46, oy-16, {color:'#f0883e', size:9});
        lbl('⇒ cos(θ) ≈ 0.93', ox-44, oy-2, {color:'#f0883e', size:9});
        ctx.restore();

        // Far vector example
        const ox2 = CW/2 + 90, oy2 = 175;
        ctx.save();
        ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(ox2, oy2); ctx.lineTo(ox2-50, oy2-60); ctx.stroke();
        lbl('a', ox2-52, oy2-66, {color:'#3fb950', size:11, bold:true});
        ctx.strokeStyle = '#ff7b72'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(ox2, oy2); ctx.lineTo(ox2+60, oy2-30); ctx.stroke();
        lbl('b', ox2+66, oy2-30, {color:'#ff7b72', size:11, bold:true});
        ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(ox2, oy2, 28, -Math.PI*0.8, -Math.PI*0.1); ctx.stroke();
        lbl('θ large', ox2-8, oy2-20, {color:'#f0883e', size:9});
        lbl('⇒ cos(θ) ≈ 0.20', ox2-8, oy2-6, {color:'#ff7b72', size:9});
        ctx.restore();

        lbl('(king ↔ queen)', CW/2-80, oy2+20, {color:'#3fb950', size:9});
        lbl('(king ↔ banana)', CW/2+90, oy2+20, {color:'#ff7b72', size:9});

        // Application
        box(20, CH-58, CW-40, 44, {fill:'#1c2330', stroke:'#30363d', r:6});
        lbl('In RAG: we embed the user\'s question → find the PDF chunks whose vectors point in the same direction.', CW/2, CH-44, {color:'#e6edf3', size:10});
        lbl('The chunks with highest cosine score = most relevant to the question. We return top-k of these.', CW/2, CH-28, {color:'#8b949e', size:9});
      },
      log: {t:'metric', m:'cosine_similarity: king↔queen=0.93 | cat↔vet=0.73 | king↔banana=0.20'},
      desc: `<strong>Cosine Similarity</strong> measures the angle between two vectors. Small angle = pointing same direction = similar meaning. The formula normalizes for length, so a long paragraph and a short sentence can still be compared fairly. <strong>In RAG</strong>: the user's question is embedded, then compared against every stored PDF chunk. The 4 chunks with the <em>highest cosine scores</em> are retrieved and sent to the AI. <em>Connection to next step: before we can embed chunks, we need to load and chunk the PDF (Tasks 3 & 4).</em>`,
      obj: { label:'cosine_similarity()', fields:[
        {k:'formula', v:'dot(a,b) / (|a| × |b|)', s:'set'},
        {k:'range', v:'0.0 (unrelated) → 1.0 (identical)', s:'set'},
        {k:'use_in_rag', v:'rank PDF chunks for query', s:'set'},
        {k:'score_heuristic', v:'>0.6 good, 0.3-0.5 weak, <0.3 noisy', s:'set'},
      ]}
    }
  ]};
}

// ─────────────────── TASK 4: CHUNKING ───────────────────
function buildTask4() {

    {
      render() {

        lbl('TextSplitter', cfgX+cfgW/2, cfgY+26, {color:'#f0883e', size:10, bold:true});

        arw(docX+docW/2, docY+docH+2, docX+docW/2, docY+docH+22, {color:'#f0883e', active:true, lw:2});
        lbl('split_documents(pages)', docX+docW/2, docY+docH+12, {color:'#f0883e', size:9});

        // Chunks row
        const chunkY = docY+docH+30;
        const nChunks = 5, chunkW = Math.min(70, (docW-10)/(nChunks)), chunkH = 36;
        const overlapW = Math.floor(chunkW * 0.2);

        for (let i = 0; i < nChunks; i++) {
          const cx2 = docX + i*(chunkW+4), cy2 = chunkY;
          box(cx2, cy2, chunkW, chunkH, {fill:'#0e3a1a', stroke:'#3fb950', r:4});
          lbl(`chunk[${i}]`, cx2+chunkW/2, cy2+12, {color:'#3fb950', size:9, bold:true});

          // Overlap zone (between chunks)
          if (i < nChunks-1) {
            box(cx2+chunkW-overlapW, cy2, overlapW+4+overlapW, chunkH, {fill:'#bc8cff33', stroke:'#bc8cff', r:2});
          }
        }
        // Overlap label
        lbl('Purple = 200-char overlap shared between adjacent chunks', docX+docW/2, chunkY+chunkH+16, {color:'#bc8cff', size:9});

        // Why chunking matters
        box(20, CH-56, CW-40, 44, {fill:'#1c2330', stroke:'#30363d', r:6});
        lbl('Why 1000 chars? One embedding vector should represent ONE focused topic.', CW/2, CH-42, {color:'#e6edf3', size:10});
        lbl('Why 200 overlap? So context at the boundary of chunks isn\'t lost — like a WAL (write-ahead log) tail.', CW/2, CH-26, {color:'#8b949e', size:9});
      },
      log: {t:'node', m:'RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=200).split_documents(pages)'},
      desc: `<strong>Task 4 — Chunking.</strong> A full PDF page can have 3,000+ characters on many different topics. If we embed a whole page, the resulting vector is a <em>blurry average</em> of all those topics — bad for retrieval. Instead, we cut each page into 1,000-character chunks. The <strong>200-character overlap</strong> means the last 200 chars of chunk[0] repeat at the start of chunk[1] — so a sentence crossing a boundary still appears intact in at least one chunk. <code>RecursiveCharacterTextSplitter</code> tries to cut at paragraph breaks first, then sentences, then hard character limits. <em>Next step: we embed each chunk individually.</em>`,
      obj: { label:'RecursiveCharacterTextSplitter', fields:[
        {k:'chunk_size', v:'1000 characters', s:'set'},
        {k:'chunk_overlap', v:'200 characters', s:'set'},
        {k:'add_start_index', v:'True', s:'set'},
        {k:'input', v:'pages[] (full page Documents)', s:'set'},
        {k:'output', v:'splits[] (focused chunks)', s:'dirty'},

      render() {

        const tx = CW/2 - Math.min(260,CW*0.45), ty = 50, tw = Math.min(520,CW*0.9), rh = 38;
        const headers = ['Setting', 'Too Small (500)', 'Just Right (1000)', 'Too Large (4000)'];
        const rows2 = [
          ['Context per chunk', '⚠️ Loses meaning', '✅ Focused topic', '❌ Blurry average'],
          ['Retrieval quality', '⚠️ Fragmented', '✅ Relevant', '❌ Noisy context'],
          ['Token cost', '✅ Cheap', '✅ Moderate', '❌ Expensive'],
          ['Chunk count', '📈 More chunks', '🎯 Balanced', '📉 Fewer chunks'],
        ];

        const colW = tw / headers.length;
        headers.forEach((h,i) => {
          box(tx+i*colW, ty, colW-2, 26, {fill:'#1c2330', stroke:'#30363d', r:4});
          lbl(h, tx+i*colW+colW/2-1, ty+13, {color:i===0?'#8b949e':i===1?'#ff7b72':i===2?'#3fb950':'#ff7b72', size:9, bold:true});
        });

        rows2.forEach((row, ri) => {
          row.forEach((cell, ci) => {
            const bg = ci===0?'#1c2330':ci===1?'#2d1010':ci===2?'#0e3a1a':'#2d1010';
            box(tx+ci*colW, ty+26+ri*rh, colW-2, rh-2, {fill:bg, stroke:'#21262d', r:3});
            lbl(cell, tx+ci*colW+colW/2-1, ty+26+ri*rh+rh/2-1, {color:ci===0?'#8b949e':ci===1?'#ff7b72':ci===2?'#3fb950':'#ff7b72', size:9, max:colW-8});
          });
        });

        // Overlap visual
        const oy = ty + 26 + rows2.length*rh + 20;
        box(tx, oy, tw, 50, {fill:'#1c2330', stroke:'#bc8cff', r:6});
        lbl('Overlap = 200 chars — the "context glue"', tx+tw/2, oy+14, {color:'#bc8cff', size:10, bold:true});
        lbl('chunk[0]: "...cats need annual rabies vaccination [←200 chars]"', tx+tw/2, oy+29, {color:'#8b949e', size:9});
        lbl('chunk[1]: "[200 chars→] vaccination is mandatory in most states..."', tx+tw/2, oy+43, {color:'#79c0ff', size:9});
      },
      log: {t:'data', m:`splits[] created — chunk_size=1000, chunk_overlap=200, N chunks total`},
      desc: `<strong>Chunk size tradeoffs.</strong> 500 chars is too small — each chunk loses the surrounding context needed to make sense. 4000 chars is too large — the embedding vector becomes a blurry average of too many topics. 1000 chars hits a <em>sweet spot</em>: one focused topic per vector. The 200-char overlap is crucial: it prevents sentences from being cut in half between chunks. Think of it like a <strong>write-ahead log</strong> where the tail of one segment is copied to the start of the next — the boundary context is never truly lost. <em>The student's Activity experiment confirms: cutting to 500/100 made retrieval worse, not better.</em>`,
      obj: { label:'splits[] — Chunked Documents', fields:[

        {k:'metadata', v:'inherited from parent Document', s:'set'},
        {k:'metadata.start_index', v:'char offset in original page', s:'set'},
      ]}
    }
  ]};
}

        box(col1X, colY, colW, colH, {fill:'#0c2d6b', stroke:'#58a6ff', r:8});
        lbl('✅ Baseline', col1X+colW/2, colY+16, {color:'#58a6ff', size:11, bold:true});
        lbl('chunk_size=1000', col1X+colW/2, colY+34, {color:'#79c0ff', size:10});
        lbl('chunk_overlap=200', col1X+colW/2, colY+48, {color:'#79c0ff', size:10});
        lbl('k=4 chunks', col1X+colW/2, colY+62, {color:'#79c0ff', size:10});
        ctx.save(); ctx.strokeStyle='#30363d'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(col1X+8, colY+74); ctx.lineTo(col1X+colW-8, colY+74); ctx.stroke();
        ctx.restore();
        lbl('Score on vet question:', col1X+colW/2, colY+90, {color:'#8b949e', size:9});
        lbl('0.87 (Top chunk)', col1X+colW/2, colY+106, {color:'#3fb950', size:12, bold:true});
        lbl('"Grounded, specific answer"', col1X+colW/2, colY+124, {color:'#3fb950', size:9});
        lbl('"Mentioned lethargy, vomiting,', col1X+colW/2, colY+140, {color:'#8b949e', size:9});
        lbl('weight loss with page citations"', col1X+colW/2, colY+154, {color:'#8b949e', size:9});
        lbl('✓ Winner', col1X+colW/2, colY+176, {color:'#3fb950', size:11, bold:true});

        // Experiment
        box(col2X, colY, colW, colH, {fill:'#2d1010', stroke:'#ff7b72', r:8});
        lbl('⚠️ Smaller Chunks', col2X+colW/2, colY+16, {color:'#ff7b72', size:11, bold:true});
        lbl('chunk_size=500', col2X+colW/2, colY+34, {color:'#79c0ff', size:10});
        lbl('chunk_overlap=100', col2X+colW/2, colY+48, {color:'#79c0ff', size:10});
        lbl('k=6 chunks', col2X+colW/2, colY+62, {color:'#79c0ff', size:10});
        ctx.save(); ctx.strokeStyle='#30363d'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(col2X+8, colY+74); ctx.lineTo(col2X+colW-8, colY+74); ctx.stroke();
        ctx.restore();
        lbl('Score on vet question:', col2X+colW/2, colY+90, {color:'#8b949e', size:9});
        lbl('~0.71 (Scores dropped)', col2X+colW/2, colY+106, {color:'#ff7b72', size:12, bold:true});
        lbl('"Fragmented answer"', col2X+colW/2, colY+124, {color:'#ff7b72', size:9});
        lbl('"Chunks too small — lost the', col2X+colW/2, colY+140, {color:'#8b949e', size:9});
        lbl('connective context between ideas"', col2X+colW/2, colY+154, {color:'#8b949e', size:9});
        lbl('✗ Regression', col2X+colW/2, colY+176, {color:'#ff7b72', size:11, bold:true});

        // Learning
        box(20, colY+colH+14, CW-40, 48, {fill:'#0e3a1a', stroke:'#3fb950', r:6});
        lbl('💡 Key lesson: Smaller chunks ≠ better retrieval.', CW/2, colY+colH+28, {color:'#3fb950', size:11, bold:true});
        lbl('500 chars is too small for medical text — each chunk loses the surrounding context.', CW/2, colY+colH+43, {color:'#8b949e', size:9});
        lbl('1000/200 captures full medical guidelines with enough context per vector.', CW/2, colY+colH+57, {color:'#8b949e', size:9});
      },
      log: {t:'metric', m:'Experiment: 500/100 → scores dropped, answer fragmented. Baseline 1000/200 wins.'},
      desc: `<strong>Activity Results.</strong> The student tried cutting <code>chunk_size</code> from 1000→500 and <code>chunk_overlap</code> from 200→100, while increasing <code>k</code> from 4→6 to compensate. Result: <em>retrieval scores dropped and the answer got worse.</em> Why? At 500 chars, medical text gets cut mid-thought — each chunk no longer has a complete idea. The vectors become blurry fragments. The 200-char overlap at 1000-char chunks was doing more work than it appeared — cutting it to 100 chars removed the crucial boundary glue. <strong>The baseline 1000/200/k=4 was already well-tuned for this dataset.</strong>`,
      obj: { label:'Experiment Comparison', fields:[
        {k:'baseline_score', v:'~0.87 (strong retrieval)', s:'set'},
        {k:'experiment_score', v:'~0.71 (scores dropped)', s:'warn'},
        {k:'baseline_answer', v:'Grounded, specific, cited', s:'set'},
        {k:'experiment_answer', v:'Fragmented (lost context)', s:'warn'},
        {k:'conclusion', v:'1000/200 is the right setting here', s:'set'},
      ]}
    },
    {
      render() {
        clr(); grid();
        lbl('🏆 System Summary — Everything We Built', CW/2, 20, {color:'#f0883e', size:13, bold:true});

        // Full pipeline summary
        const nodes = [
          {x:0.08, y:0.38, label:'cat_health\n.pdf', color:'#8b949e', fill:'#1c2330', stroke:'#30363d', w:70, h:52},
          {x:0.22, y:0.38, label:'Document\nobjects', color:'#58a6ff', fill:'#0c2d6b', stroke:'#58a6ff', w:80, h:52},
          {x:0.38, y:0.38, label:'1000-char\nchunks', color:'#bc8cff', fill:'#1a0e3a', stroke:'#bc8cff', w:78, h:52},
          {x:0.54, y:0.38, label:'Qdrant\nvectors', color:'#3fb950', fill:'#0e3a1a', stroke:'#3fb950', w:78, h:52},
          {x:0.70, y:0.20, label:'User\nQuestion', color:'#ffa657', fill:'#3d2700', stroke:'#ffa657', w:72, h:46},
          {x:0.70, y:0.62, label:'Top-4\nChunks', color:'#58a6ff', fill:'#0c2d6b', stroke:'#58a6ff', w:72, h:46},
          {x:0.87, y:0.38, label:'🤖 GPT\nAnswer', color:'#3fb950', fill:'#0e3a1a', stroke:'#3fb950', w:74, h:52},
        ];

        const bW = Math.min(900, CW);
        const bH = CH - 40;
        const ox = (CW - bW) / 2, oy = 36;

        nodes.forEach((n, i) => {
          const nx = ox + n.x * bW - n.w/2, ny = oy + n.y * bH - n.h/2;
          const lines = n.label.split('\n');
          box(nx, ny, n.w, n.h, {fill:n.fill, stroke:n.stroke, r:8});
          lines.forEach((line, li) => lbl(line, nx+n.w/2, ny+n.h/2-6+li*14, {color:n.color, size:9, bold:true, max:n.w-4}));

          // Arrows
          if (i === 0) arw(ox+nodes[0].x*bW-nodes[0].w/2+nodes[0].w, oy+nodes[0].y*bH, ox+nodes[1].x*bW-nodes[1].w/2, oy+nodes[1].y*bH, {color:'#30363d',lw:1.5});
          if (i === 1) arw(ox+nodes[1].x*bW-nodes[1].w/2+nodes[1].w, oy+nodes[1].y*bH, ox+nodes[2].x*bW-nodes[2].w/2, oy+nodes[2].y*bH, {color:'#30363d',lw:1.5});
          if (i === 2) arw(ox+nodes[2].x*bW-nodes[2].w/2+nodes[2].w, oy+nodes[2].y*bH, ox+nodes[3].x*bW-nodes[3].w/2, oy+nodes[3].y*bH, {color:'#30363d',lw:1.5});
          // User question → Qdrant
          if (i === 4) {
            const n4 = nodes[4], n3 = nodes[3], n5 = nodes[5], n6 = nodes[6];
            arw(ox+n4.x*bW, oy+n4.y*bH+n4.h/2, ox+n3.x*bW, oy+n3.y*bH, {color:'#ffa657',active:true,lw:1.5,dash:[4,3]});
            lbl('embed+search', ox+(n4.x+n3.x)/2*bW+10, oy+(n4.y+n3.y)/2*bH-8, {color:'#ffa657',size:8});
            arw(ox+n3.x*bW+n3.w/2, oy+n3.y*bH+n3.h/2, ox+n5.x*bW, oy+n5.y*bH, {color:'#58a6ff',active:true,lw:2});
            lbl('top-k', ox+(n3.x+n5.x)/2*bW+10, oy+(n3.y+n5.y)/2*bH+10, {color:'#58a6ff',size:8});
            arw(ox+n4.x*bW+n4.w/2+4, oy+n4.y*bH, ox+n6.x*bW-4, oy+n6.y*bH, {color:'#ffa657',lw:1.5,dash:[3,3]});
            arw(ox+n5.x*bW+n5.w/2, oy+n5.y*bH, ox+n6.x*bW-4, oy+n6.y*bH, {color:'#3fb950',active:true,lw:2});
            lbl('context', ox+(n5.x+n6.x)/2*bW+4, oy+(n5.y+n6.y)/2*bH+4, {color:'#3fb950',size:8});
          }
        });

        // Labels
        lbl('T3', ox+nodes[0].x*bW, oy+nodes[0].y*bH+nodes[0].h/2+12, {color:'#30363d',size:8});
        lbl('T4', ox+nodes[1].x*bW, oy+nodes[1].y*bH+nodes[1].h/2+12, {color:'#30363d',size:8});
        lbl('T5', ox+nodes[2].x*bW, oy+nodes[2].y*bH+nodes[2].h/2+12, {color:'#30363d',size:8});
        lbl('T5', ox+nodes[3].x*bW, oy+nodes[3].y*bH+nodes[3].h/2+12, {color:'#30363d',size:8});
        lbl('T2/T6', ox+nodes[4].x*bW, oy+nodes[4].y*bH-nodes[4].h/2-10, {color:'#30363d',size:8});
        lbl('T6/T7', ox+nodes[5].x*bW, oy+nodes[5].y*bH+nodes[5].h/2+12, {color:'#30363d',size:8});
        lbl('T7', ox+nodes[6].x*bW, oy+nodes[6].y*bH+nodes[6].h/2+12, {color:'#30363d',size:8});
      },
      log: {t:'ok', m:'🏆 Complete! Load→Chunk→Embed→Store→Retrieve→Generate — all tasks done!'},
      desc: `<strong>Complete RAG System.</strong> You've now built every piece: (T3) PyPDFLoader turns the PDF into Document objects → (T4) RecursiveCharacterTextSplitter cuts them into 1000-char chunks with 200-char overlap → (T5) OpenAIEmbeddings vectorizes every chunk, QdrantVectorStore stores the vectors → (T6/T7) a user question is embedded and the top-4 most similar chunks are retrieved → the context is formatted with source labels and handed to gpt-5.4-mini which generates a cited answer. <strong>The activity confirmed: the 1000/200/k=4 defaults were well-chosen for this medical text dataset.</strong> Congratulations — you've built your first RAG pipeline! 🎉`,
      obj: { label:'System Complete ✅', fields:[
        {k:'load', v:'PyPDFLoader → Document objects', s:'set'},
        {k:'chunk', v:'1000 chars, 200 overlap', s:'set'},
        {k:'embed', v:'text-embedding-3-small (1536D)', s:'set'},
        {k:'store', v:'Qdrant :memory: collection', s:'set'},
        {k:'retrieve', v:'similarity_search k=4', s:'set'},
        {k:'generate', v:'gpt-5.4-mini with citations', s:'set'},
      ]}
    }
  ]};
}

// Init
buildAllTasks();
setupCanvas();
clr(); grid();
</script>
